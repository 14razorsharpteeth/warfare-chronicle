            {
                id: 'assyria-omnibus',
                category: 'assyria',
                title: 'The Assyrian War Machine: Iron, Siege Engines, and Terror',
                author: 'King Ashurbanipal',
                thumbnail: svgAssets.assyria,
                heroImage: svgAssets.assyria,
                summary: 'The brutal founders of standing armies. Exploring the transition to iron weaponry, massive siege towers, chariot shock tactics, and the use of Assyrian Mastiffs.',
                fullText: `
                    <p class="dropcap">The Neo-Assyrian Empire (911–609 BC) is often credited with creating the world's first true professional standing army. Driven by a culture that demanded constant expansion to appease the god Ashur, they built an unstoppable, highly organized war machine heavily reliant on advanced iron metallurgy and sheer psychological terror.</p>
                    
                    <h2>1. The Iron Revolution and Combined Arms</h2>
                    <h3>Iron Swords and Spears</h3>
                    <p>The Assyrians were among the first to fully equip vast armies with <strong>Iron Weaponry</strong> on an industrial scale. While early iron was not necessarily sharper than good bronze, it was far more abundant. Assyrian blacksmiths churned out thousands of straight, double-edged iron swords and iron-tipped spears. This allowed the state to field much larger armies than their bronze-wielding neighbors.</p>
                    
                    <h3>Heavy Chariots</h3>
                    <p>The Assyrian <strong>Heavy War Chariot</strong> was a massive vehicle compared to the light Egyptian variants. Pulled by up to four horses, it carried a crew of three or four men (a driver, an archer wielding a composite bow, and one or two shield-bearers). Its heavy, multi-spoked wheels were designed to crash directly into enemy infantry lines.</p>
                    
                    <h2>2. Masters of the Siege: Battering Rams and Sappers</h2>
                    <p>The Assyrian mastery of <strong>Siege Warfare</strong> was unprecedented. Cities in the ancient Near East relied on massive mud-brick walls. The Assyrians countered this by deploying sophisticated <strong>Siege Towers and Battering Rams</strong>.</p>
                    <p>Their rams were massive, armored wooden vehicles covered in wet animal hides to prevent them from catching fire. Inside, a heavy timber shaft tipped with an iron blade (often shaped like a spear or axe) was swung back and forth on chains. Rather than just smashing gates, these iron tips were used to literally pry apart the mud-brick matrix of city walls. Meanwhile, Assyrian sappers (engineers) relentlessly tunneled beneath the walls to collapse their foundations, while archers provided covering fire from tall wicker shields (spara).</p>
                    
                    <h2>3. Beasts of War & Psychological Terror</h2>
                    <p><strong>The First True Cavalry:</strong> The Assyrians were the pioneers of true horseback cavalry. Early on, they rode in pairs (one man holding the reins for both horses while the other fired a bow), but they eventually developed specialized horse breeds and saddles, evolving into independent mounted archers and lancers, slowly replacing the chariot. The state ran massive horse-breeding farms (muskannu) to maintain the supply.</p>
                    <p><strong>Assyrian Mastiffs:</strong> The Assyrian kings kept massive, heavily muscled war dogs. Depicted frequently in royal reliefs, these dogs were used for the prestigious royal lion hunts, but were also brought on military campaigns to hunt down fleeing enemies, guard the baggage trains, and terrorize captive populations.</p>
                    <p><strong>Psychological Warfare:</strong> The Assyrians utilized calculated, horrific terror as a primary weapon of war. When a city resisted a siege and was finally breached, the Assyrians systematically flayed the rebel leaders alive and pinned their skins to the city walls. They impaled thousands on stakes and constructed massive pyramids of severed heads. This was not blind rage, but state policy: to ensure that the next city would surrender instantly upon hearing the Assyrian army was approaching.</p>
                `
            },
            {
                id: 'byzantine-omnibus',
                category: 'byzantine',
                title: 'The Byzantine Cataphract: Greek Fire and the Dromon',
                author: 'Emperor Maurice',
                thumbnail: svgAssets.byzantine,
                heroImage: svgAssets.byzantine,
                summary: 'The surviving Roman East. A tactical breakdown of the fully-armored Cataphract, the Paramérion saber, Greek Fire, and heavily barded war horses.',
                fullText: `
                    <p class="dropcap">While the Western Roman Empire fell, the Eastern Roman (Byzantine) Empire survived for another thousand years. Surrounded by Sassanid Persians, Islamic Caliphates, and migrating steppe nomads, the Byzantine military evolved from traditional infantry legions into a highly mobile, tactically complex force centered on elite heavy cavalry.</p>
                    
                    <h2>1. The Ultimate Cavalryman: The Cataphract (Kataphraktos)</h2>
                    <h3>The Kontos and the Paramérion</h3>
                    <p>The core of Byzantine power was the <strong>Cataphract</strong>, a super-heavy cavalryman completely encased in armor. Their primary shock weapon was the <strong>Kontos</strong>, a massive wooden lance roughly 4 meters (13 ft) long, wielded with two hands. The sheer kinetic energy of a tightly packed formation of Cataphracts charging with leveled kontoi could shatter any infantry line.</p>
                    <p>For close-quarters melee, the Cataphract relied on the <strong>Paramérion</strong>. Abandoning the straight Roman gladius, the paramérion was a curved, single-edged saber heavily influenced by steppe nomad (Avar and Khazar) weapons. The curve allowed for devastating drawing cuts from horseback. They also carried the <em>Menaulion</em>, a thick, heavy spear used by specialized infantry to break enemy cavalry charges.</p>
                    
                    <h3>Klibanion Armor</h3>
                    <p>The Cataphract wore layers of protection. Over a padded gambeson, they wore the <strong>Klibanion</strong>, a lamellar cuirass made of hundreds of interlocking iron or bronze plates. Over this, they often wore an <em>Epilorikion</em> (a thick padded surcoat) to deflect arrows and sun heat.</p>
                    
                    <h2>2. The Secret Weapon: Greek Fire and Naval Warfare</h2>
                    <p><strong>Greek Fire (Liquid Fire):</strong> The Byzantines possessed the most guarded military secret of the Middle Ages: Greek Fire. It was an incendiary liquid (likely a mixture containing naphtha, quicklime, and sulfur) that burned fiercely on water and could not be extinguished with water. </p>
                    <p>It was deployed via a <strong>Siphono-phoros</strong>, a highly pressurized bronze pump and tube system. The Byzantines mounted these projectors on the bows of their ships, creating literal flamethrowers that projected a roaring jet of liquid flame up to 15 meters, completely incinerating massive Arab fleets during the Sieges of Constantinople.</p>
                    
                    <h2>3. Beasts of War & Defense in Depth</h2>
                    <p><strong>Armored Horses (Barding):</strong> A Cataphract was only as strong as his mount. Byzantine war horses were heavily barded (armored) with felt, boiled leather, or horn lamellae that draped down to their knees, making the rider and mount a virtual medieval tank. The horses were specially bred for weight-carrying capacity rather than pure speed.</p>
                    <p><strong>Camels vs Nomads:</strong> On the eastern frontiers fighting Arab and Persian forces, the Byzantines frequently employed camels for logistics and occasionally in combat to disrupt enemy cavalry, as horses unfamiliar with camels will panic at their scent.</p>
                    <p><strong>Grand Strategy (The Strategikon):</strong> Unlike Western Europe, the Byzantines approached war scientifically. Emperors authored manuals like the <em>Strategikon</em>, which detailed specific, pragmatic tactics tailored to defeat specific enemies. The empire relied on the <em>Theme System</em>, where local peasant-soldiers held land in exchange for military service, retreating to castles during invasions and using guerrilla tactics while the central army (Tagmata) mobilized.</p>
                `
            },
            {
                id: 'ottoman-omnibus',
                category: 'ottoman',
                title: 'The Ottoman Cannon: Janissaries and the Fall of Walls',
                author: 'Sultan Mehmed II',
                thumbnail: svgAssets.ottoman,
                heroImage: svgAssets.ottoman,
                summary: 'The gunpowder empire that broke Constantinople. Analyzing the super-massive Dardanelles Gun, Janissary musketry, the deadly Yataghan sword, and massive ox-train logistics.',
                fullText: `
                    <p class="dropcap">The Ottoman Empire bridged the medieval and early modern eras by becoming the first state to fully embrace and integrate gunpowder artillery and standing infantry armed with firearms. Their terrifying logistical capacity and embrace of new technology culminated in the epoch-defining <strong>Fall of Constantinople (1453)</strong>.</p>
                    
                    <h2>1. The Gunpowder Revolution: Bombards and Matchlocks</h2>
                    <h3>The Great Turkish Bombard (Dardanelles Gun)</h3>
                    <p>The Ottomans revolutionized siege warfare with extreme-caliber artillery. Under the supervision of the Hungarian engineer Orban, they cast massive bronze bombards. The most famous was a monster over 5 meters (17 ft) long, weighing 16 tons. It fired solid marble and granite cannonballs that weighed up to 600 kg (1,300 lbs) over a mile. The recoil was so massive it required massive wooden shock absorbers, and it took three hours to reload. However, a single direct hit from this stone sphere would instantly vaporize sections of the Theodosian Walls, which had stood impregnable for a thousand years.</p>
                    
                    <h3>Janissaries and the Matchlock</h3>
                    <p>The core of the Ottoman infantry was the <strong>Janissaries</strong>, an elite standing corps of slave-soldiers drafted as boys (the Devshirme system) and fanatically trained. They were among the first professional units in the world to be entirely equipped with firearms. They utilized heavy <strong>Matchlock Muskets</strong>—smoothbore guns fired by lowering a smoldering piece of hemp rope into a flashpan of powder. While slow to load, a disciplined Janissary volley could shatter heavy European cavalry charges before they reached the lines.</p>
                    
                    <h2>2. The Arsenal of the Sultan: Yataghan and Composite Bow</h2>
                    <p>For close quarters combat, the Janissaries carried the <strong>Yataghan</strong>. This unique short sword had a forward-curving, single-edged blade, but crucially, it lacked a traditional crossguard. The hilt flared out into "ears" made of bone or ivory to keep the hand secure. The forward curve gave it immense hacking power, similar to the ancient falcata, making it a devastating weapon in the brutal trench warfare of a siege.</p>
                    <p>Despite the adoption of firearms, the Ottomans maintained the <strong>Turkish Composite Bow</strong>. In the hands of Ottoman Sipahi (heavy cavalry), it was used to lay down a rapid, plunging suppression fire that muskets of the era simply could not match in rate of fire.</p>
                    
                    <h2>3. Beasts of War & Psychological Warfare</h2>
                    <p><strong>Turkoman Horses and Akindji:</strong> The Ottoman Sipahi rode magnificent Arabian and Turkoman horses, prized for their speed, intelligence, and stamina. Ahead of the main army rode the <em>Akindji</em>, irregular light cavalry who used their fast horses to raid deep into enemy territory, burning crops and spreading terror days before the main Ottoman force arrived.</p>
                    <p><strong>Massive Ox-Trains:</strong> The true logistical miracle of the Ottoman army was their beast-of-burden network. Moving a 16-ton bronze bombard required a train of 60 to 100 oxen, accompanied by 200 men who marched ahead to physically pave roads and build wooden bridges just to support the weight of the cannon.</p>
                    <p><strong>Psychological Warfare (The Mehter):</strong> The Ottomans were the first to utilize a professional, centralized military band—the <em>Mehter</em>. Utilizing massive kettle drums (kös) carried by camels, crashing cymbals, and shrill zurna (oboes), they created a deafening, rhythmic wall of sound. Played constantly during a siege, it synchronized the marching of the troops while inducing sheer psychological dread in the defenders.</p>
                `
            },
            {
                id: 'mughal-omnibus',
                category: 'mughal',
                title: 'The Mughal War Machine: Wootz Steel and War Elephants',
                author: 'Emperor Akbar',
                thumbnail: svgAssets.mughal,
                heroImage: svgAssets.mughal,
                summary: 'The gunpowder lords of India. A deep dive into the metallurgy of Wootz steel (Damascus), heavy matchlock Jezails, and the terrifying deployment of armored War Elephants and camels.',
                fullText: `
                    <p class="dropcap">The Mughal Empire (1526–1857) conquered the Indian subcontinent by fusing Central Asian nomadic mobility with Indian heavy armor and cutting-edge gunpowder technology. Starting with Babur's stunning victory at the <strong>First Battle of Panipat (1526)</strong>, the Mughals redefined warfare in South Asia.</p>
                    
                    <h2>1. The Metallurgy of the Gods: Wootz Steel and the Tulwar</h2>
                    <h3>Wootz Steel (Damascus)</h3>
                    <p>The crown jewel of Mughal weaponry was the metallurgy of <strong>Wootz Steel</strong> (often erroneously called Damascus steel in the West). Indian smiths placed wrought iron, charcoal, and glass in a sealed crucible and heated it for days. The resulting steel ingots possessed an ultra-high carbon content (1.5%) with a micro-structure of hard cementite wires embedded in a softer steel matrix. When forged and acid-etched, it revealed a beautiful, flowing water-like pattern. More importantly, it created a blade of unimaginable sharpness that retained its edge through heavy combat without shattering.</p>
                    
                    <h3>The Tulwar</h3>
                    <p>This steel was primarily forged into the <strong>Tulwar</strong>. This heavily curved saber was the standard sidearm of Mughal cavalry and infantry. It featured a distinct hilt with a thick, disc-shaped pommel that locked the wrist in place. This forced the warrior to rely on the motion of the shoulder and arm to deliver massive, sweeping drawing cuts, capable of slicing cleanly through thick quilted armor and flesh.</p>
                    
                    <h2>2. Gunpowder: The Jezail and the Matchlock</h2>
                    <p>The Mughal infantry utilized the <strong>Jezail</strong>, a heavy, long-barreled matchlock (and later flintlock) musket. Firing a massive caliber lead ball, the unusually long barrel (often over 1.5 meters) allowed all the black powder to burn completely before the ball exited, giving the weapon extreme range and kinetic force, capable of punching through heavy Indian chainmail at significant distances.</p>
                    
                    <h2>3. Beasts of War: Elephants, Camels, and Horses</h2>
                    <p><strong>Armored War Elephants:</strong> Unlike the Carthaginians, the Mughals heavily armored the massive Indian elephant. Elephants were draped in <em>Pakhar</em>, massive coats of heavy steel scale armor that covered their heads, trunks, and flanks, making them virtually immune to arrows and early musket fire. Heavy iron chains or poison-tipped swords were sometimes strapped to their tusks. They carried a <em>Howdah</em> (a fortified wooden or iron turret) on their back, seating the commander and elite matchlock musketeers. Male elephants were often given wine and kept in a state of <em>Musth</em> (heightened testosterone) to make them hyper-aggressive in battle.</p>
                    <p><strong>The Zamburak Camel Artillery:</strong> For mobile artillery, the Mughals perfected the <strong>Zamburak</strong>. This was a heavy, large-caliber swivel gun (a miniature cannon) mounted on a wooden saddle on the back of a camel. The camel would kneel, effectively acting as an organic tripod. This allowed the Mughals to deploy devastating, fast-moving artillery batteries across the rough terrain of the Deccan plateau where heavy wheeled cannons could not travel.</p>
                    <p><strong>Marwari Horses:</strong> The Mughal heavy cavalry rode beautiful, inward-eared Marwari horses, draped in chainmail barding, allowing them to charge headlong into enemy musket fire with relative impunity.</p>
                `
            },
            {
                id: 'inca-omnibus',
                category: 'inca',
                title: 'Lords of the Andes: Bronze Maces and Mountain Logistics',
                author: 'Sapa Inca Pachacuti',
                thumbnail: svgAssets.inca,
                heroImage: svgAssets.inca,
                summary: 'The empire of the mountains. An analysis of the devastating star-headed Macana, the Estolica dart thrower, and the miracle of Andean logistics using Llama caravans.',
                fullText: `
                    <p class="dropcap">The Inca Empire (Tawantinsuyu) conquered the brutal, vertical terrain of the Andes mountains without the wheel, iron, or horses. Their military supremacy relied on highly disciplined levy armies, devastating blunt-force weaponry, and an unparalleled logistical network that spanned 25,000 miles of mountain roads.</p>
                    
                    <h2>1. The Arsenal of Stone and Bronze: Macana and Boleadoras</h2>
                    <h3>The Macana (Star-Mace)</h3>
                    <p>In a world where warriors wore thick, quilted cotton armor (which easily caught slashing obsidian), the Inca relied heavily on crushing blunt-force trauma. The primary weapon of the shock infantry was the <strong>Macana</strong>. This was a heavy wooden shaft topped with a spherical or star-shaped head crafted from stone, copper, or—for the elite—hardened bronze. The multi-pointed star design concentrated the kinetic energy of the swing into a tiny surface area, allowing a warrior to easily crush a man's skull or shatter a collarbone right through his armor.</p>
                    
                    <h3>The Estolica and Boleadoras</h3>
                    <p>Before the melee clash, Inca skirmishers rained death from afar. They utilized the <strong>Estolica</strong> (the Andean atlatl/spear-thrower) to hurl copper-tipped darts with immense velocity. Even more unique was the use of <strong>Boleadoras (Bolas)</strong>. These were three heavy stones wrapped in leather and tied to interconnected cords. Swung overhead and released, the centrifugal force caused the stones to spread out. When they struck an enemy warrior, the cords would instantly wrap around their legs, snapping bones and sending the victim crashing to the ground, helpless.</p>
                    <p>The most feared ranged weapon was the simple <strong>Sling (Huaraca)</strong>. Woven from llama wool, an Inca slinger could hurl a heavy stone with the kinetic force of an early pistol bullet, capable of cracking Spanish steel helmets and killing horses outright.</p>
                    
                    <h2>2. Armor and Defensive Tactics</h2>
                    <p>Inca warriors wore tunics of densely quilted cotton, and carried heavy wooden shields covered in deer hide. Elite units wore helmets fashioned from woven cane or carved wood, decorated with copper plates and the bright feathers of jungle birds. While ineffective against Spanish firearms, this armor was perfectly adapted to deflect the slings and bronze maces of their South American rivals.</p>
                    
                    <h2>3. Beasts of Burden & Mountain Logistics</h2>
                    <p><strong>Llamas and Alpacas:</strong> Unlike the Aztecs who had no pack animals, the Inca relied entirely on the Llama. Llamas are not strong enough to be ridden by adult men in combat, but they are exceptional beasts of burden in high altitudes. The Inca army was accompanied by massive caravans of thousands of llamas carrying extra weaponry, maize, and freeze-dried potatoes (chuño). The animals themselves also served as a walking food source (ch'arki/jerky) for the troops.</p>
                    <p><strong>The Shock of Spanish Horses:</strong> Because the Inca had never seen an animal large enough to ride, the arrival of Spanish cavalry under Pizarro was utterly devastating. The psychological shock of armored warhorses charging through their lines, combined with the extreme height advantage it gave Spanish swordsmen, broke Inca formations that outnumbered the Spanish ten to one.</p>
                    <p><strong>The Qollqa System:</strong> The true secret to the Inca war machine was their logistics. Spaced exactly a day's march apart along their 25,000-mile paved road network were the <em>Qollqas</em>—massive state-run stone storehouses. This allowed an Inca army of tens of thousands of men to march at breakneck speed across freezing mountain passes without carrying a baggage train, simply drawing fresh supplies from the qollqas as they moved.</p>
                `
            },
            {
                id: 'zulu-omnibus',
                category: 'zulu',
                title: 'The Horns of the Buffalo: The Iklwa and the Zulu Impi',
                author: 'King Shaka Zulu',
                thumbnail: svgAssets.zulu,
                heroImage: svgAssets.zulu,
                summary: 'The apex of African infantry tactics. Exploring Shaka Zulu\'s revolution: the short stabbing Iklwa, the Ishlangu shield, and the crushing Bull Horn formation powered by cattle logistics.',
                fullText: `
                    <p class="dropcap">In the early 19th century, King Shaka transformed the Zulu people from a small tribe into a militarized empire. By completely overhauling traditional African warfare—replacing skirmishing with hyper-aggressive, close-quarters annihilation tactics—the Zulu Impi became a force capable of wiping out modern British columns, as seen at the <strong>Battle of Isandlwana (1879)</strong>.</p>
                    
                    <h2>1. Shaka's Weaponry Revolution: The Iklwa and Ishlangu</h2>
                    <h3>The Iklwa (Stabbing Spear)</h3>
                    <p>Before Shaka, local warfare involved warriors standing at a distance and throwing light javelins (assegais), resulting in few casualties. Shaka deemed this cowardly. He introduced the <strong>Iklwa</strong>, a short spear with a massive, 25 cm (10 in) broad iron blade and a stout wooden shaft. It was not meant to be thrown. It was a dedicated, close-quarters stabbing weapon, used with an underhand thrust to the enemy's abdomen. Its name is reportedly onomatopoeic, mimicking the sucking sound the blade made as it was pulled from a victim's flesh.</p>
                    
                    <h3>The Ishlangu (Cowhide Shield)</h3>
                    <p>The Iklwa was paired with the <strong>Ishlangu</strong>, a massive, oval shield made of hardened ox hide stretched over a central wooden spine. Standing roughly 1.3 meters tall, it covered the warrior from chin to ankle. The genius of the Zulu martial art lay in the shield’s offensive use. A Zulu warrior would charge, hook the left edge of his Ishlangu behind the enemy's shield, and violently wrench it to the right. This instantly spun the enemy around, exposing their unprotected left flank for a fatal thrust from the Iklwa.</p>
                    
                    <h2>2. Tactical Annihilation: The Bull Horn Formation</h2>
                    <p>The Zulu army (the Impi) abandoned chaotic skirmishing for a highly disciplined, multi-stage tactical maneuver designed for total encirclement and annihilation, known as the <strong>Horns of the Buffalo (Impondo Zankomo)</strong>.</p>
                    <ul>
                        <li><strong>The Chest (Isifuba):</strong> The most veteran and heavily armed warriors. They charged directly into the center of the enemy line to pin them in brutal hand-to-hand combat.</li>
                        <li><strong>The Horns (Izimpondo):</strong> Fast, athletic, younger warriors deployed on the extreme flanks. They sprinted in a massive flanking arc to completely encircle the enemy, linking up at the rear to prevent any escape.</li>
                        <li><strong>The Loins (Umuva):</strong> A massive reserve of veterans who sat with their backs to the battle. The commander would commit them to reinforce the Chest or exploit a breakthrough.</li>
                    </ul>
                    
                    <h2>3. Beasts of War & Barefoot Logistics</h2>
                    <p><strong>Nguni Cattle:</strong> The Zulu economy, culture, and military logistics revolved entirely around Nguni cattle. The shield colors of the Ishlangu were matched to the hides of specific herds, designating the regiment (e.g., black shields for veterans, white for rookies). On campaign, the Zulu drove massive herds of cattle with them. They provided milk and fresh meat on the march, and in desperate combat situations, the Zulus would stampede the cattle directly into enemy lines to act as a living, crushing shield against musket fire.</p>
                    <p><strong>Barefoot Mobility:</strong> Shaka famously discarded leather sandals, forcing his warriors to march barefoot over thorns and hot rocks until the soles of their feet became thick callouses. This drastically increased the army's mobility. An Impi could run up to 50 miles in a single day and fight a massive battle at the end of it.</p>
                `
            },
            {
                id: 'celtic-omnibus',
                category: 'celtic',
                title: 'Fury of the Gauls: Longswords, Chariots, and Chainmail',
                author: 'Vercingetorix',
                thumbnail: svgAssets.celtic,
                heroImage: svgAssets.celtic,
                summary: 'The terrifying warriors of Iron Age Europe. Analyzing the invention of chainmail, the metallurgical brilliance of the Celtic Longsword, chariot tactics, and massive war hounds.',
                fullText: `
                    <p class="dropcap">The Celtic and Gallic tribes of Iron Age Europe were terrifying adversaries who famously sacked Rome in 390 BC and pushed Julius Caesar to the brink of destruction. Far from uncultured barbarians, they were master metallurgists who invented revolutionary armor and wielded fearsome iron longswords that defined European warfare for centuries.</p>
                    
                    <h2>1. Master Metallurgists: The Longsword and Chainmail</h2>
                    <h3>The Celtic Iron Longsword</h3>
                    <p>While the Romans favored the short stabbing gladius, the Celtic elite utilized the <strong>Iron Longsword</strong>. Measuring 75 to 90 cm in length, these weapons were masterworks of early iron forging. The blades were relatively thin and flexible, often with rounded points, because they were designed almost exclusively for devastating, overhead downward slashes. Swung with immense force by a tall Gallic warrior, these swords could cleave right through early bronze helmets. Because early iron could sometimes bend under massive impact, warriors were occasionally forced to step on their swords mid-battle to straighten them out.</p>
                    
                    <h3>The Invention of Chainmail</h3>
                    <p>The greatest contribution of the Celts to military history was the invention of <strong>Chainmail (Maille)</strong> around the 3rd century BC. Celtic blacksmiths painstakingly drew iron wire, cut it into thousands of tiny rings, and riveted them together in a complex 4-in-1 pattern. This created a metallic fabric that was incredibly flexible and highly resistant to slashing from swords. The Romans were so impressed by Celtic chainmail that they immediately copied it, creating the <em>Lorica Hamata</em>, which remained the standard Roman armor for centuries.</p>
                    
                    <h2>2. The Roar of Battle: The Carnyx</h2>
                    <p><strong>The Carnyx:</strong> Celtic psychological warfare began before the lines clashed. They utilized the <strong>Carnyx</strong>, a massive bronze war trumpet standing vertically, often topped with the stylized head of a snarling boar or dragon with an articulated wooden tongue. When blown, it emitted a harsh, terrifying, booming roar. Combined with warriors crashing their swords against their tall oak shields, it created a wall of chaotic noise designed to shatter enemy morale.</p>
                    
                    <h2>3. Beasts of War & Fortifications</h2>
                    <p><strong>Celtic Chariot Ponies:</strong> While chariots died out in the Mediterranean, the Celts (especially in Britain) perfected their use. Celtic chariots were light, incredibly fast, and pulled by rugged native ponies. They featured a suspension system using woven leather straps to absorb the shock of rough terrain. Warriors would ride into battle on the chariot, hurl their javelins (lancea), and then acrobatically run out onto the wooden yoke between the galloping horses to strike the enemy before leaping down to fight on foot, using the chariot as a mobile retreat platform.</p>
                    <p><strong>War Hounds (Irish Wolfhounds):</strong> The Celts, particularly the Gaels, bred massive dogs for war, the ancestors of the modern Irish Wolfhound. These giant, shaggy hounds were brought to the battlefield specifically to drag enemy cavalrymen down from their horses and to hunt down fleeing skirmishers.</p>
                    <p><strong>Fortifications (Oppida):</strong> The Gauls defended their lands using massive hillforts known as <em>Oppida</em>. Their walls utilized a unique construction called the <em>Murus Gallicus</em> (Gallic Wall). It consisted of a timber framework filled with rubble and faced with stone. The internal timber framework gave the wall a slight flex, allowing it to absorb the impact of Roman battering rams without shattering like solid masonry would.</p>
                `
            }
        ];

        const feedView = document.getElementById('feed-view');
        const articleView = document.getElementById('article-view');
        const articleGrid = document.getElementById('article-grid');
        const fullArticleContent = document.getElementById('full-article-content');
        const navLinks = document.querySelectorAll('.nav-link');

        function filterCategory(category) {
            navLinks.forEach(link => {
                if (link.dataset.category === category) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });

            let filteredArticles = articles;
            if (category !== 'all') {
                filteredArticles = articles.filter(a => a.category === category);
            }

            renderGrid(filteredArticles);
            showFeed();
        }

        function renderGrid(articleList) {
            articleGrid.innerHTML = '';
            
            articleList.forEach(article => {
                const card = document.createElement('article');
                card.className = "flex flex-col border border-ink/20 bg-parchment-dark/40 p-6 rounded-sm shadow-sm group cursor-pointer transition-all hover:shadow-lg hover:bg-parchment-dark/60 transform hover:-translate-y-1";
                card.onclick = () => openArticle(article.id);
                
                card.innerHTML = `
                    <div class="overflow-hidden mb-6 rounded-sm h-64 relative border border-ink/10">
                        <span class="absolute top-3 left-3 bg-ink text-parchment font-cinzel text-xs font-bold px-3 py-1 z-10 uppercase tracking-widest shadow-md">${article.category}</span>
                        <img src="${article.thumbnail}" alt="${article.title}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
                    </div>
                    <h3 class="font-cinzel text-2xl md:text-3xl font-bold mb-4 group-hover:text-crimson transition-colors leading-snug">
                        ${article.title}
                    </h3>
                    <p class="text-ink/80 text-base mb-6 flex-grow leading-relaxed">
                        ${article.summary}
                    </p>
                    <div class="mt-auto border-t-2 border-ink/10 pt-4 flex justify-between items-center text-sm font-cinzel font-bold text-ink/70 uppercase tracking-widest">
                        <span><i class="fa-solid fa-feather-pointed mr-2"></i> ${article.author}</span>
                        <span class="text-crimson group-hover:text-ink transition-colors">Read Archive <i class="fa-solid fa-arrow-right ml-1"></i></span>
                    </div>
                `;
                articleGrid.appendChild(card);
            });
        }

        function openArticle(id) {
            const article = articles.find(a => a.id === id);
            if (!article) return;

            fullArticleContent.innerHTML = `
                <div class="mb-6 border-b border-ink/20 pb-4">
                    <span class="bg-crimson text-parchment px-3 py-1 text-xs font-bold font-cinzel uppercase tracking-widest shadow-sm">${article.category}</span>
                </div>
                
                <h1 class="font-cinzel text-4xl md:text-5xl lg:text-6xl font-bold mb-8 text-ink leading-tight">
                    ${article.title}
                </h1>
                
                <div class="flex items-center gap-3 mb-10 text-ink/80 font-cinzel font-semibold tracking-wider text-sm border-b-2 border-ink/10 pb-6">
                    <div>
                        <div class="uppercase">Archived Dispatch by <span class="text-crimson font-bold">${article.author}</span></div>
                    </div>
                </div>

                <div class="w-full h-64 md:h-[500px] overflow-hidden rounded-sm mb-12 shadow-xl border border-ink/20 relative bg-ink">
                    <img src="${article.heroImage}" class="w-full h-full object-cover opacity-90" alt="Hero Image">
                </div>

                <div class="article-body font-lora max-w-none text-ink text-lg leading-relaxed md:px-8">
                    ${article.fullText}
                </div>
                
                <div class="mt-16 pt-8 border-t border-ink/20 flex justify-center">
                    <button onclick="showFeed()" class="bg-ink text-parchment px-8 py-4 font-cinzel font-bold hover:bg-crimson transition-colors uppercase tracking-widest shadow-lg transform hover:-translate-y-1">
                        <i class="fa-solid fa-book-open mr-2"></i> Return to Front Page
                    </button>
                </div>
            `;

            feedView.classList.remove('active');
            setTimeout(() => {
                feedView.style.display = 'none';
                articleView.style.display = 'block';
                void articleView.offsetWidth; 
                articleView.classList.add('active');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 300);
        }

        function showFeed() {
            articleView.classList.remove('active');
            setTimeout(() => {
                articleView.style.display = 'none';
                feedView.style.display = 'block';
                void feedView.offsetWidth;
                feedView.classList.add('active');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 300);
        }

        let lastScrollY = window.scrollY;
        const mainHeader = document.getElementById('main-header');

        window.addEventListener('scroll', () => {
            const currentScrollY = window.scrollY;
            
            // If scrolling down and we have scrolled past the initial header area
            if (currentScrollY > lastScrollY && currentScrollY > 150) {
                mainHeader.classList.add('-translate-y-full');
            } else {
                // If scrolling up
                mainHeader.classList.remove('-translate-y-full');
            }
            
            lastScrollY = currentScrollY;
        }, { passive: true });

        document.addEventListener('DOMContentLoaded', () => {
            filterCategory('all');
        });

    </script>
</body>
